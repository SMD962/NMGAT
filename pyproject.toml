[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmgat"
version = "0.2.0"
description = "Nuclear mass regression with graph attention and auditable historical results"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "torch==2.6.0", "torch-geometric==2.7.0", "tqdm>=4.65"]

[project.scripts]
nmgat-train = "nmgat.workflow:train_main"
nmgat-predict = "nmgat.workflow:predict_main"

[tool.setuptools.packages.find]
where = ["src"]
